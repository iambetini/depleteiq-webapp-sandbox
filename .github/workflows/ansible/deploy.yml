---
- name: Deploy Application
  hosts: "webapp"
  become: no
  vars:
    app_user: "{{ lookup('env', 'SSH_USER')| default('root') }}"
    project_name: "{{ lookup('env', 'PROJECT') | default('myapp') }}"
    deploy_dir: "/home/{{ app_user }}/projects/{{ project_name }}/"
    source_dir: "{{ lookup('env', 'SOURCE_DIR') | default('.') }}/"
    ansible_ssh_common_args: "-o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o ControlMaster=no"
    ansible_command_timeout: 900
    ssl_email: "{{ lookup('env', 'SSL_EMAIL') | default('admin@example.com') }}"
    domain_names: "{{ lookup('env', 'DOMAIN_NAMES') | default('') }}" # Comma-separated list of domains

  tasks:
    - name: Validate deployment parameters
      assert:
        that:
          - deploy_dir is defined
          - project_name is defined
          - source_dir is defined
        fail_msg: "Required deployment parameters are not defined"

    - name: Ensure deployment directory exists
      file:
        path: "{{ deploy_dir }}"
        state: directory
        mode: "0755"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"

    # ========== SSL CERTIFICATE SETUP WITH CERTBOT ==========
    - name: Check if SSL certificates already exist
      stat:
        path: "/etc/letsencrypt/live/{{ domain_names.split(',')[0] | trim }}/fullchain.pem"
      register: certbot_done
      become: true
      when: domain_names != ""

    - name: Check if SSL config active
      shell: |
        cd "/etc/nginx/sites-enabled/{{ project_name }}"
        grep -q "listen 443 ssl" nginx.conf
      register: has_ssl
      failed_when: false
      changed_when: false

    - name: Run Certbot once for Nginx (PM2 setup)
      become: true
      command: >
        certbot --nginx 
        --agree-tos 
        --no-eff-email
        --email {{ ssl_email }}
        --non-interactive 
        --staging 
        --redirect
        --domains {{ domain_names.split(',') | map('trim') | join(',') }}
      when:
        - domain_names != ""
        - not certbot_done.stat.exists
        - has_ssl.rc != 0
      register: certbot_result

    - name: Copy current repository files to server
      synchronize:
        src: "{{ source_dir }}"
        dest: "{{ deploy_dir }}"
        recursive: yes
        delete: yes
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=node_modules"
          - "--exclude=.next"

    # ========== NGINX CONFIGURATION ==========
    - name: Check if nginx config file exists after copy
      stat:
        path: "{{ deploy_dir }}nginx.conf"
      register: nginx_config_exists

    - name: Deploy Nginx configuration
      become: true
      when: nginx_config_exists.stat.exists
      block:
        - name: Copy Nginx configuration
          copy:
            src: "{{ source_dir }}nginx.conf"
            dest: "/etc/nginx/sites-available/{{ project_name }}"
            owner: root
            group: root
            mode: "0644"
          register: nginx_copied

        - name: Enable site if not already enabled
          file:
            src: "/etc/nginx/sites-available/{{ project_name }}"
            dest: "/etc/nginx/sites-enabled/{{ project_name }}"
            state: link
          when: nginx_copied is changed

        - name: Remove default Nginx config
          file:
            path: /etc/nginx/sites-enabled/default
            state: absent

        - name: Test Nginx configuration
          command: nginx -t
          register: nginx_test
          changed_when: false
          failed_when: nginx_test.rc != 0

        - name: Reload Nginx if config changed
          systemd:
            name: nginx
            state: reloaded
          when: nginx_copied is changed and nginx_test.rc == 0

    - name: Remove existing build folder
      file:
        path: "{{ deploy_dir }}.next"
        state: absent

    - name: Install dependencies with pnpm
      command: pnpm install --frozen-lockfile
      args:
        chdir: "{{ deploy_dir }}"
      become_user: "{{ app_user }}"

    - name: Build the Next.js application
      command: pnpm build
      args:
        chdir: "{{ deploy_dir }}"
      become_user: "{{ app_user }}"

    - name: Deploy via PM2 Ecosystem
      shell: |
        pm2 delete {{ project_name }} || true
        pm2 start ecosystem.config.js
      args:
        chdir: "{{ deploy_dir }}"
      become_user: "{{ app_user }}"

    - name: Persist PM2 state
      command: pm2 save
      become_user: "{{ app_user }}"

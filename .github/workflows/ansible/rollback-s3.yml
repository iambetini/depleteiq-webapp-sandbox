        that:
          - sorted_backups is defined
          - sorted_backups | length >= backup_number
        fail_msg: |
          Backup #{{ backup_number }} does not exist!
          Available backups: {{ sorted_backups | length }}

          Please choose a number between 1 and {{ sorted_backups | length }}

    - name: Select backup to restore
      set_fact:
        backup_to_restore: "{{ sorted_backups[backup_number - 1] }}"
        backup_filename: "{{ sorted_backups[backup_number - 1] | basename }}"

    - name: Display selected backup
      debug:
        msg: |
          📦 Selected Backup Information:
          ================================
          S3 Key: {{ backup_to_restore }}
          Filename: {{ backup_filename }}
          Position: #{{ backup_number }} of {{ sorted_backups | length }} available
          ================================

    - name: Ensure temporary restore directory exists
      file:
        path: "{{ temp_restore_dir }}"
        state: directory

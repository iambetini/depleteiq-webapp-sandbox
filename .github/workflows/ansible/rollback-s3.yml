        region: "{{ aws_region }}"
      register: s3_backups
      delegate_to: localhost

    - name: Filter and sort backups
      set_fact:
        sorted_backups: "{{ s3_backups.s3_keys | select('match', '.*backup_.*\\.tar\\.gz$') | sort | reverse | list }}"

---
- name: Backup Current Deployment to AWS S3
  hosts: "webapp"
  become: no
  vars:
      app_user: "{{ lookup('env', 'SSH_USER')| default('root') }}"
      stage: "{{ lookup('env', 'STAGE') | default('dev') }}"
      project_name: "{{ lookup('env', 'PROJECT') | default('myapp') }}"
      deploy_dir: "/home/{{ app_user }}/projects/{{ project_name }}"
      temp_backup_dir: "/home/{{ app_user }}/backups"
      local_backup_dir: "/tmp/backups"
      backup_retention: "{{ lookup('env', 'retention') | default(5) }}"
      s3_bucket: "{{ lookup('env', 'S3_BUCKET') }}"
      s3_prefix: "backups/{{ project_name }}/{{ stage}}"
      aws_region: "{{ lookup('env', 'AWS_REGION') | default('eu-west-2') }}"

  tasks:
      - name: Set timestamp once at playbook start
        set_fact:
            backup_timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"

      - name: Validate required variables
        assert:
            that:
                - deploy_dir is defined
                - project_name is defined
                - s3_bucket is defined
                - s3_bucket | length > 0
            fail_msg: "Required variables are not defined. Ensure S3_BACKUP_BUCKET is set."

      - name: Check if deployment directory exists
        stat:
            path: "{{ deploy_dir }}"
        register: deployment_exists

      - name: Check if deployment has files to backup
        find:
            paths: "{{ deploy_dir }}"
            file_type: any
            recurse: no
        register: deployment_files
        when: deployment_exists.stat.exists

      - name: Skip backup if no deployment exists
        when: not deployment_exists.stat.exists
        debug:
            msg: "No existing deployment found at {{ deploy_dir }}, skipping backup"

      - name: Skip backup if directory is empty
        when:
            - deployment_exists.stat.exists
            - deployment_files.matched == 0
        debug:
            msg: "Deployment directory {{ deploy_dir }} is empty, skipping backup"

      - name: Ensure temporary backup directory exists
        file:
            path: "{{ temp_backup_dir }}"
            state: directory
            mode: "0755"
        when:
            - deployment_exists.stat.exists
            - deployment_files.matched > 0

      - name: Create temporary backup archive
        archive:
            path:
                - "{{ deploy_dir }}/*"
                - "{{ deploy_dir }}/.[!.]*"
            dest: "{{ temp_backup_dir }}/backup_{{ backup_timestamp }}.tar.gz"
            format: gz
            exclude_path:
                - "{{ deploy_dir }}/node_modules"
                - "{{ deploy_dir }}/.next"
                - "{{ deploy_dir }}/out"
                - "{{ deploy_dir }}/.git"
                - "{{ deploy_dir }}/storage/logs/*"
                - "{{ deploy_dir }}/vendor"
            remove: no
        when:
            - deployment_exists.stat.exists
            - deployment_files.matched > 0
        register: backup_created

      - name: Get backup file size
        stat:
            path: "{{ temp_backup_dir }}/backup_{{ backup_timestamp }}.tar.gz"
        register: backup_file
        when: backup_created is changed

      - name: Ensure local backup directory exists on GitHub runner
        file:
            path: "{{ local_backup_dir }}"
            state: directory
            mode: "0755"
        delegate_to: localhost
        run_once: true
        when: backup_created is changed

      #   Download backup from remote server to GitHub runner
      - name: Fetch backup to local
        fetch:
            src: "{{ temp_backup_dir }}/backup_{{ backup_timestamp }}.tar.gz"
            dest: "{{ local_backup_dir }}/backup_{{ backup_timestamp }}.tar.gz"
            flat: yes
        when: backup_created is changed
        register: backup_fetched

      - name: Upload backup to S3
        block:
            - name: Upload backup to S3
              amazon.aws.s3_object:
                  bucket: "{{ s3_bucket }}"
                  object: "{{ s3_prefix }}/backup_{{ backup_timestamp }}.tar.gz"
                  src: "{{ temp_backup_dir }}/backup_{{ backup_timestamp }}.tar.gz"
                  mode: put
                  region: "{{ aws_region }}"
                  encrypt: false
                  rgw: true
                  metadata:
                      project: "{{ project_name }}"
                      timestamp: "{{ backup_timestamp }}"
                      server: "{{ inventory_hostname }}"
                  aws_access_key: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') }}"
                  aws_secret_key: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') }}"
                  endpoint_url: "{{ lookup('env', 'DO_BUCKET_ENDPOINT') }}"
              when: backup_fetched is changed
              register: s3_upload

        always:
            #   Clean up local backup on GitHub runner
            - name: Remove local backup file
              file:
                  path: "{{ local_backup_dir }}/backup_{{ backup_timestamp }}.tar.gz"
                  state: absent
              delegate_to: localhost
              when: s3_upload is changed or backup_fetched is changed

            - name: Remove temporary backup file
              file:
                  path: "{{ temp_backup_dir }}/backup_{{ backup_timestamp }}.tar.gz"
                  state: absent
              when: backup_created is changed

      - name: List all backups in S3
        amazon.aws.s3_object:
            bucket: "{{ s3_bucket }}"
            mode: list
            prefix: "{{ s3_prefix }}/"
            region: "{{ aws_region }}"
            aws_access_key: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') }}"
            aws_secret_key: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') }}"
            endpoint_url: "{{ lookup('env', 'DO_BUCKET_ENDPOINT') }}"
        register: s3_backups
        when:
            - deployment_exists.stat.exists
            - deployment_files.matched > 0

      - name: Sort backups by name (timestamp based)
        set_fact:
            sorted_backups: "{{ s3_backups.s3_keys | select('match', '.*backup_.*\\.tar\\.gz$') | sort | reverse | list }}"
        when: s3_backups.s3_keys is defined

      - name: Identify old backups to delete (keep last {{ backup_retention }})
        set_fact:
            backups_to_delete: "{{ sorted_backups[backup_retention | int:] }}"
        when:
            - sorted_backups is defined
            - sorted_backups | length > backup_retention | int

      - name: Delete old backups from S3
        amazon.aws.s3_object:
            bucket: "{{ s3_bucket }}"
            object: "{{ item }}"
            mode: delobj
            region: "{{ aws_region }}"
            aws_access_key: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') }}"
            aws_secret_key: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') }}"
            endpoint_url: "{{ lookup('env', 'DO_BUCKET_ENDPOINT') }}"
        loop: "{{ backups_to_delete }}"
        when:
            - backups_to_delete is defined
            - backups_to_delete | length > 0
        register: deleted_backups

      - name: Display backup information
        debug:
            msg: |
                {% if backup_created is changed %}
                ✓ Backup Created and Uploaded Successfully!
                S3 Location: s3://{{ s3_bucket }}/{{ s3_prefix }}/backup_{{ backup_timestamp }}.tar.gz
                Backup Size: {{ (backup_file.stat.size / 1024 / 1024) | round(2) }} MB
                Region: {{ aws_region }}
                {% elif not deployment_exists.stat.exists %}
                ℹ No existing deployment to backup
                {% elif deployment_files.matched == 0 %}
                ℹ Deployment directory is empty, no backup created
                {% else %}
                ℹ Backup not needed
                {% endif %}

                {% if sorted_backups is defined %}
                Current backups in S3 (keeping last {{ backup_retention }}):
                Total: {{ sorted_backups | length }} backups
                {% if backups_to_delete is defined and backups_to_delete | length > 0 %}
                Deleted: {{ backups_to_delete | length }} old backups
                {% endif %}
                {% endif %}

name: Deploy depleteiq-webapp to Dev

on:
  push:
    branches: 
     - dev

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/depleteiq-webapp

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set image tag
        id: tag
        run: echo "image_tag=$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Create .env.production from secret
        run: echo "${{ secrets.DEPLETEIQ_DEV_WEBAPP_ENV_FILE }}" > .env.production

      - name: Build Docker image (env baked in)
        run: |
          docker build \
            --build-arg ENV_FILE_CONTENT="$(cat .env.production)" \
            -t $IMAGE_NAME:${{ steps.tag.outputs.image_tag }} \
            -t $IMAGE_NAME:latest \
            .

      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME:${{ steps.tag.outputs.image_tag }}
          docker push $IMAGE_NAME:latest

##########################################################################
# ENVIRONMENT DEPLOYMENTS
##########################################################################
  deploy-dev:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/dev'

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Prepare SSH key & host (dev)
        run: |
          echo "HOST=${{ secrets.DO_HOST_DEPLETEIQ_WEBAPP_DEV }}" >> $GITHUB_ENV
          printf '%s\n' "${{ secrets.DO_SSH_KEY_DEPLETEIQ_WEBAPP_DEV }}" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key
          
      - name: Create .env.production from secret
        run: echo "${{ secrets.DEPLETEIQ_DEV_WEBAPP_ENV_FILE }}" > .env.production

      - name: Deploy to dev
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DO_SSH_KEY_DEPLETEIQ_WEBAPP_DEV }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa" \
            docker-compose.yml next.config.mjs nginx.conf .env.production \
            root@${{ env.HOST }}:/var/www/depleteiq-webapp

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa root@${{ env.HOST }} << 'EOF'
            cd /var/www/depleteiq-webapp
            docker images | grep "ghcr.io/orbit-technologies-01/depleteiq-webapp" | awk '{print $3}' | xargs -r docker rmi -f
            export APP_IMAGE=ghcr.io/orbit-technologies-01/depleteiq-webapp:${{ needs.build-and-push.outputs.image_tag }}
            export APP_CONTAINER_NAME=depleteiq-webapp-app
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose down
            docker compose pull
            docker compose up -d
          EOF


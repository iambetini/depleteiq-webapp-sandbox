# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["dev", "staging", "production", feature/*, bugfix/*]

env:
  project: "depleteiq"
  application: "webapp"

jobs:
  build_and_test:
    runs-on: runner
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - run: pnpm i -- lockfile

      - run: npm run dev:start

      - run: pnpm build

      # - name: Type check
      #   run: npm run type-check # or npx tsc --noEmit

      # - name: Lint
      #   run: npm run lint

      - run: npm test

  deploy:
    name: Deploy to Server
    runs-on: runner
    # Requires successful build and test
    needs: build_and_test
    # Run job if branch is production, stage and dev
    if: github.ref == 'refs/heads/production' || github.ref == 'refs/heads/stage' || github.ref == 'refs/heads/dev' || github.ref == 'refs/feature/pipeline-fix'
    # Set environment for job based on branch
    environment: ${{  github.ref == 'refs/heads/production' && 'production' || github.ref == 'refs/heads/stage' && 'stage' || 'dev' }}
    # Set stage variable to branch name
    env:
      stage: ${{  github.ref == 'refs/heads/production' && 'production' || github.ref == 'refs/heads/stage' && 'stage' || 'dev' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - id: install-aws-cli
        uses: unfor19/install-aws-cli-action@v1
        with:
          version: 2

      - name: Install Ansible
        if: startsWith(runner.name, 'GitHub Actions')
        run: |
          python -m pip install --upgrade pip
          pip install ansible
          ansible --version

      # Download terraform state file and set vm_ips output to environment variable
      - name: Get terraform state for VM IPs
        id: ip_output
        run: |
          aws s3 cp "s3://${S3_BUCKET}/${STATE_KEY}" terraform.tfstate
          echo "vm_ips=$(terraform output -json vm_ips)" >> $GITHUB_OUTPUT
          rm terraform.tfstate
        env:
          STATE_KEY: "terraform-orbit/${{ env.project }}/${{ env.stage }}/terraform.tfstate"
          S3_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

        # Create .env, docker-compose and nginx file from Secrets and replace placeholders
      - name: Populate .env and docker-compose and nginx file
        run: |
          echo "Writing .env from GitHub Secret..."

          cat > .env.production << 'EOF'
          ${{ secrets.ENV_FILE }}
          EOF

          echo "Writing nginx config file"
          cat > nginx.conf << 'EOF'
          ${{ secrets.NGINX_CONFIG }}
          EOF
           
          # Get every VM IPs for API servers
          API_IP=$(echo '${{ steps.ip_output.outputs.vm_ips }}' | jq -r '[to_entries[] | select(.key | contains("-api-")) | .value] | join(" ")')
          WEBAPP_IP=$(echo '${{ steps.ip_output.outputs.vm_ips }}' | jq -r '[to_entries[] | select(.key | contains("-webapp-")) | .value] | join(" ")')

          # Replace the placeholders in .env.production
          sed -i "s/__APP_URL__/$WEBAPP_IP/g" .env.production
          sed -i "s/__API_URL__/$API_IP/g" .env.production

          # Replace the placeholder in nginx.conf
          sed -i "s/__NGINX_SERVER_HOST__/$WEBAPP_IP/g" nginx.conf

          echo API_IP is $API_IP
          echo WEBAPP_IP is $WEBAPP_IP

          cat nginx.conf

      #  SSH key setup with passphrase
      - name: Setup SSH key with Passphrase
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
        run: |
          # Install expect
          sudo apt-get update && sudo apt-get install -y expect

          # Start ssh-agent
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${SSH_PRIVATE_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Create expect script to add key with passphrase
          cat > /tmp/add_ssh_key.exp << 'EXPECTEOF'
          #!/usr/bin/expect -f
          set timeout 10
          set keyfile [lindex $argv 0]
          set passphrase [lindex $argv 1]

          spawn ssh-add $keyfile
          expect {
            "Enter passphrase for" {
              send "$passphrase\r"
              exp_continue
            }
            "Identity added" {
              exit 0
            }
            timeout {
              puts "Timeout waiting for ssh-add"
              exit 1
            }
            eof
          }
          EXPECTEOF

          chmod +x /tmp/add_ssh_key.exp
          /tmp/add_ssh_key.exp ~/.ssh/id_rsa "$SSH_KEY_PASSPHRASE" 

          # Verify key was added
          echo "Keys in ssh-agent:"
          ssh-add -l

          # Add all IPs to known_hosts
          for ip in $(echo '${{ steps.ip_output.outputs.vm_ips }}' | jq -r '.[]'); do
            echo "Adding $ip to known_hosts..."
            ssh-keyscan -H $ip >> ~/.ssh/known_hosts 2>/dev/null || true
          done

          echo "known_hosts content:"
          cat ~/.ssh/known_hosts

      # Checking SSHworks with passphrase
      - name: Test SSH Connection
        run: |
          echo "Testing SSH connections..."
          for ip in $(echo '${{ steps.ip_output.outputs.vm_ips }}' | jq -r '.[]'); do
            echo "Testing connection to $ip..."
            ssh -o StrictHostKeyChecking=no root@$ip "echo 'SSH to $ip successful'" || echo "Failed to connect to $ip"
          done

      # Dynamically create Ansible Inventory for runbooks
      - name: Create Ansible Inventory
        run: |
          cat > inventory.ini << EOF
          [all:vars]
          ansible_user=${SSH_USER}
          ansible_ssh_common_args=-o StrictHostKeyChecking=no
          ansible_python_interpreter=/usr/bin/python3

          [webapp]
          EOF

          # Add WEBAPP servers filtered by VM_NAME
          echo '${{ steps.ip_output.outputs.vm_ips }}' | jq -r \
            'to_entries[] | 
            select(.key | contains("-webapp-")) | 
            "\(.key) ansible_host=\(.value)"' >> inventory.ini

          # Add the final part
          cat >> inventory.ini << 'EOF'

          [droplets:children]
          webapp
          EOF

          echo "Generated Ansible Inventory:"
          cat inventory.ini
        env:
          vm_name: "${{ env.project }}-${{ env.application }}"
          SSH_USER: ${{ secrets.SSH_USER }}

      #  Executre code backup on server with ansible
      - name: Run Code Backup
        run: ansible-playbook -i inventory.ini .github/workflows/ansible/backup.yml
        env:
          PROJECT: ${{ env.project }}
          SSH_USER: ${{ secrets.SSH_USER }}

      # Deploy latest changes to server with ansible
      - name: Deploy App
        run: ansible-playbook -i inventory.ini .github/workflows/ansible/deploy.yml
        env:
          PROJECT: ${{ env.project }}
          SSH_USER: ${{ secrets.SSH_USER }}
          app_container: ${{ secrets.APP_CONTAINER }}
          nginx_container: ${{ secrets.NGINX_CONTAINER }}
          postgres_container: ${{ secrets.POSTGRES_CONTAINER }}
          SOURCE_DIR: ${{ github.workspace }}

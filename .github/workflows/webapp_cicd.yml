name: Webapp Pipeline

run-name: |
  ${{
    github.ref == 'refs/heads/prod' && 'Deploy to Prod' ||
    github.ref == 'refs/heads/stage' && 'Deploy to Stage' ||
    github.ref == 'refs/heads/dev' && 'Deploy to Dev' ||
    'Running CI '
  }} by @${{ github.actor }}

on:
  push:
    branches: ["dev", "stage", "prod"]
  pull_request:
    branches: [prod, dev, stage]

env:
  project: "depleteiq"
  application: "webapp"
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  check-source-branch:
    name: Check PR Source Branch
    runs-on: ubuntu-latest
    steps:
      - name: Ensure source is stage
        if: github.event_name == 'pull_request' && github.base_ref == 'prod'
        run: |
          if [[ "${{ github.head_ref }}" != "stage"  && "${{ github.base_ref }}" == "prod" ]]; then
            echo "Error: You can only merge into 'prod' from the 'stage' branch."
            exit 1
          fi

      - name: Close PR to Prod
        uses: actions/github-script@v9
        if: failure() && github.event_name == 'pull_request' && github.base_ref == 'prod'
        with:
          script: |
            const body = `**PR Closed**: This repository only allows merges from \`staging\` branch to \`${{ github.base_ref }}\`.

            Please close this PR and open a new one from \`staging\` → \`${{ github.base_ref }}\`.`;
            console.log(body);
            console.log('Closing PR #' + context.issue.number);

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              state: 'closed'
            });

  lint:
    name: Lint
    needs: check-source-branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (check only)
        run: pnpm lint
        continue-on-error: true # Don't fail on lint errors

  type-check:
    name: Type Check
    needs: check-source-branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check
        continue-on-error: true

  build_and_test:
    name: Build and Test
    needs: check-source-branch
    runs-on: ubuntu-latest
    # Set environment for job based on branch (needed to resolve
    # environment-scoped secrets: ENV_FILE, DIGITALOCEAN_ACCESS_TOKEN, etc.)
    environment: ${{  github.ref == 'refs/heads/prod' && 'prod' || github.ref == 'refs/heads/stage' && 'stage' || 'dev' }}
    env:
      stage: ${{  github.ref == 'refs/heads/prod' && 'prod' || github.ref == 'refs/heads/stage' && 'stage' || 'dev' }}
    outputs:
      artifact_key: ${{ steps.upload.outputs.artifact_key }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Cache Framework Build Artifacts
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-build-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Everything below this point exists only to produce and ship a
      # deployable artifact. Skipped on pull_request: PRs never deploy (see
      # the `deploy` job's `if:`), so building one here would just be a real
      # DO Spaces upload with real secrets for an object nothing ever
      # downloads or cleans up. `pnpm build` above still runs on PRs - that's
      # the actual validation value (catches build breakage before merge).
      - name: Install DigitalOcean doctl
        if: github.event_name != 'pull_request'
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      # Droplet IPs are stable, pre-existing infrastructure - resolving this
      # here (instead of only in deploy) lets .env.production get the real
      # webapp IP substituted in before pnpm build runs, matching today's
      # ordering (IP resolved, then build) now that build happens here.
      - name: Get IP for environment
        if: github.event_name != 'pull_request'
        id: ip_output
        run: |
          RAW_DATA=$(doctl compute droplet get ${project}-${application}-1-${stage} --format "Name,PrivateIPv4" --no-header)
          JSON_MAP=$(echo "$RAW_DATA" | jq -R -c 'split(" ") | map(select(. != "")) | {(.[0]): .[1]}')
          echo "vm_ips=$JSON_MAP" >> $GITHUB_OUTPUT

      - name: Write env file
        if: github.event_name != 'pull_request'
        run: |
          echo "Writing .env from GitHub Secret..."
          cat > .env.production << 'EOF'
          ${{ secrets.ENV_FILE }}
          EOF

          WEBAPP_IP=$(echo '${{ steps.ip_output.outputs.vm_ips }}' | jq -r '[to_entries[] | select(.key | contains("-webapp-")) | .value] | join(" ")')
          sed -i "s/__APP_URL__/$WEBAPP_IP/g" .env.production

          echo WEBAPP_IP is $WEBAPP_IP

      - name: Build
        run: pnpm build

      - name: Assemble standalone bundle
        if: github.event_name != 'pull_request'
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp .env.production .next/standalone/.env.production
          tar -czf build.tar.gz -C .next/standalone .

      - id: install-aws-cli
        if: github.event_name != 'pull_request'
        uses: unfor19/install-aws-cli-action@v1
        with:
          version: 2

      - id: upload
        name: Upload build artifact to DO Spaces
        if: github.event_name != 'pull_request'
        run: |
          KEY="infra/nextjs-artifacts/${{ env.project }}-${{ env.application }}/${{ env.stage }}/${{ github.run_id }}.tar.gz"
          aws s3 cp build.tar.gz "s3://${{ secrets.CI_BUILDS_BUCKET }}/$KEY" --endpoint-url "${{ secrets.DO_BUCKET_ENDPOINT }}"
          echo "artifact_key=$KEY" >> "$GITHUB_OUTPUT"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

  deploy:
    name: Deploy to Server
    runs-on: runner
    # Requires successful build and test
    needs: build_and_test
    # Run job if branch is prod, stage and dev
    if: github.ref == 'refs/heads/prod' || github.ref == 'refs/heads/stage' || github.ref == 'refs/heads/dev'
    # Set environment for job based on branch
    environment: ${{  github.ref == 'refs/heads/prod' && 'prod' || github.ref == 'refs/heads/stage' && 'stage' || 'dev' }}
    # Set stage variable to branch name
    env:
      stage: ${{  github.ref == 'refs/heads/prod' && 'prod' || github.ref == 'refs/heads/stage' && 'stage' || 'dev' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/workflows/ansible

      # - name: Setup Terraform
      #   uses: hashicorp/setup-terraform@v3

      - name: Install DigitalOcean doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - id: install-aws-cli
        uses: unfor19/install-aws-cli-action@v1
        with:
          version: 2

      - name: Install Ansible
        if: startsWith(runner.name, 'GitHub Actions')
        run: |
          python -m pip install --upgrade pip
          pip install ansible
          ansible --version

      # Download terraform state file and set vm_ips output to environment variable
      # - name: Get terraform state for VM IPs
      #   id: ip_output
      #   run: |
      #     aws s3 cp "s3://${S3_BUCKET}/${STATE_KEY}" terraform.tfstate
      #     echo "vm_ips=$(terraform output -json vm_ips)" >> $GITHUB_OUTPUT
      #     rm terraform.tfstate
      #   env:
      #     STATE_KEY: "terraform-orbit/${{ env.project }}/${{ env.stage }}/terraform.tfstate"
      #     S3_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      #     AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Get IP for environment
        id: ip_output
        run: |
          RAW_DATA=$(doctl compute droplet get ${project}-${application}-1-${stage} --format "Name,PrivateIPv4" --no-header)
          JSON_MAP=$(echo "$RAW_DATA" | jq -R -c 'split(" ") | map(select(. != "")) | {(.[0]): .[1]}')
          echo "vm_ips=$JSON_MAP" >> $GITHUB_OUTPUT

      - name: Download build artifact from DO Spaces
        run: |
          mkdir -p build-output
          aws s3 cp "s3://${{ secrets.CI_BUILDS_BUCKET }}/${{ needs.build_and_test.outputs.artifact_key }}" build.tar.gz --endpoint-url "${{ secrets.DO_BUCKET_ENDPOINT }}"
          tar -xzf build.tar.gz -C build-output
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

        # Create nginx and pm2 config from Secrets and replace placeholders
        # (.env.production is not written here - it already arrived inside
        # the downloaded build artifact, pre-substituted in build_and_test)
      - name: Populate nginx and pm2 config file
        run: |
          echo "Writing nginx config file"
          cat > build-output/nginx.conf << 'EOF'
          ${{ secrets.NGINX_CONFIG }}
          EOF

          echo "Writing ecosystem config file"
          cat > build-output/ecosystem.config.js << 'EOF'
          ${{ secrets.ECO_CONFIG }}
          EOF

          # Get every VM IPs for API servers
          # API_IP=$(echo '${{ steps.ip_output.outputs.vm_ips }}' | jq -r '[to_entries[] | select(.key | contains("-api-")) | .value] | join(" ")')
          WEBAPP_IP=$(echo '${{ steps.ip_output.outputs.vm_ips }}' | jq -r '[to_entries[] | select(.key | contains("-webapp-")) | .value] | join(" ")')

          # Replace the placeholder in nginx.conf
          sed -i "s/__NGINX_SERVER_HOST__/$WEBAPP_IP/g" build-output/nginx.conf

          echo API_IP is $API_IP
          echo WEBAPP_IP is $WEBAPP_IP

      #  SSH key setup with passphrase
      - name: Setup SSH key with Passphrase
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV

          echo "${SSH_PRIVATE_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # This bypasses the need for a real terminal (TTY)
          cat << 'EOF' > ~/.ssh/askpass.sh
          #!/bin/bash
          echo "${SSH_KEY_PASSPHRASE}"
          EOF
          chmod +x ~/.ssh/askpass.sh

          export DISPLAY=:0
          export SSH_ASKPASS=~/.ssh/askpass.sh
          export SSH_KEY_PASSPHRASE="${SSH_KEY_PASSPHRASE}"

          # Force ssh-add to use askpass by redirecting input from /dev/null
          ssh-add ~/.ssh/id_rsa < /dev/null

          rm ~/.ssh/askpass.sh
          ssh-add -l

          # 6. Add IPs to known_hosts
          for ip in $(echo '${{ steps.ip_output.outputs.vm_ips }}' | jq -r '.[]'); do
            ssh-keyscan -H $ip >> ~/.ssh/known_hosts 2>/dev/null || true
          done

      # Checking SSHworks with passphrase
      - name: Test SSH Connection
        run: |
          echo "Testing SSH connections..."
          for ip in $(echo '${{ steps.ip_output.outputs.vm_ips }}' | jq -r '.[]'); do
            echo "Testing connection to $ip..."
            ssh -o StrictHostKeyChecking=no root@$ip "echo 'SSH to $ip successful'" || echo "Failed to connect to $ip"
          done

      # Dynamically create Ansible Inventory for runbooks
      - name: Create Ansible Inventory
        run: |
          cat > inventory.ini << EOF
          [all:vars]
          ansible_user=${SSH_USER}
          ansible_ssh_common_args=-o StrictHostKeyChecking=no
          ansible_python_interpreter=/usr/bin/python3

          [webapp]
          EOF

          # Add WEBAPP servers filtered by VM_NAME
          echo '${{ steps.ip_output.outputs.vm_ips }}' | jq -r \
            'to_entries[] |
            select(.key | contains("-webapp-")) |
            "\(.key) ansible_host=\(.value)"' >> inventory.ini

          # Add the final part
          cat >> inventory.ini << 'EOF'

          [droplets:children]
          webapp
          EOF

          echo "Generated Ansible Inventory:"
          cat inventory.ini
        env:
          vm_name: "${{ env.project }}-${{ env.application }}"
          SSH_USER: ${{ secrets.SSH_USER }}

      #  Execute code backup on server with ansible
      - name: Run Code Backup to S3
        run: ansible-playbook -i inventory.ini .github/workflows/ansible/backup-s3.yml
        env:
          PROJECT: "${{ env.project }}-${{ env.application }}"
          SSH_USER: ${{ secrets.SSH_USER }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          DO_BUCKET_ENDPOINT: ${{ secrets.DO_BUCKET_ENDPOINT }}
          S3_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          STAGE: ${{ env.stage }}
          retention: 5

      # Deploy latest changes to server with ansible
      - name: Deploy App
        run: ansible-playbook -i inventory.ini .github/workflows/ansible/deploy.yml
        env:
          PROJECT: "${{ env.project }}-${{ env.application }}"
          SSH_USER: ${{ secrets.SSH_USER }}
          SOURCE_DIR: ${{ github.workspace }}/build-output
          SSL_EMAIL: ${{ secrets.SSL_EMAIL }}
          DOMAIN_NAMES: ${{ secrets.DOMAIN_NAMES }}
